<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso Administrador | ELOHIM</title>

<!-- FUENTES -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Bodoni+Moda:wght@700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ICONOS -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- CSS -->

<link rel="stylesheet" href="admin.css">

</head>

<body>

<!--==================================
FONDO
===================================-->

<div class="fondoAdmin">

    <!-- Tarjeta -->

    <div class="tarjetaAdmin">

        <!-- Logo -->

        <img
        src="logo.png"
        alt="ELOHIM"
        class="logoAdmin">

        <!-- Nombre -->

        <h1>ELOHIM</h1>

        <h3>Panel del Dueño</h3>

        <p>

            Bienvenido<br>

            <strong>Administrador</strong>

        </p>

        <!-- Botón -->

        <button id="btnInicio">

            <i class="fa-solid fa-lock"></i>

            Inicio

        </button>

    </div>

</div>

<!--==================================
MODAL CONTRASEÑA
===================================-->

<div id="modalPassword" class="modalPassword">

    <div class="contenidoPassword">

        <i class="fa-solid fa-user-shield iconoAdmin"></i>

        <h2>Acceso Seguro</h2>

        <p>

            Ingresa la contraseña del administrador

        </p>

        <input
        type="password"
        id="password"
        placeholder="Contraseña">

        <small
        id="mensajeError">

        </small>

        <div class="botones">

            <button id="btnEntrar">

                <i class="fa-solid fa-right-to-bracket"></i>

                Entrar

            </button>

            <button id="btnCancelar">

                Cancelar

            </button>

        </div>

    </div>

</div>

<!--==================================
JAVASCRIPT
===================================-->

<script src="admin.js"></script>

</body>

</html>
